# Cargo configuration for CrowdControl project

[alias]
# Run unit tests only (fast, no external dependencies)
test-unit = "test --lib"

# Run CLI black-box tests (requires Docker and cargo-bin)
test-cli = "test --package crowdcontrol-cli -- --ignored"

# Run all tests including Docker-dependent ones
test-all = "test -- --ignored"

# Run tests without Docker dependency
test-fast = "test --lib"
