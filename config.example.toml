# CrowdControl Configuration File
# Place this file at ~/.crowdcontrol/config.toml

# Directory for storing agent data (workspaces, projects, metadata)
# Default: ~/.crowdcontrol
# workspaces_dir = "~/.crowdcontrol"

# Docker image to use for agents
# Default: crowdcontrol:latest
# image = "crowdcontrol:latest"

# Default memory limit for new agents
# Examples: "512m", "2g", "4096m"
# default_memory = "2g"

# Default CPU limit for new agents  
# Examples: "0.5", "1", "2"
# default_cpus = "1"

# Verbosity level (0-2)
# 0 = normal, 1 = verbose, 2 = debug
# verbose = 0